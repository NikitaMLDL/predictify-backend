<!DOCTYPE html>
<html>
<head>
    <title>Iris Classifier</title>
</head>
<body>
    <h1>Iris Classifier Inference v3</h1>
    <form method="post">
        <label>Sepal Length:</label><input type="number" step="0.1" name="sepal_length" required><br>
        <label>Sepal Width:</label><input type="number" step="0.1" name="sepal_width" required><br>
        <label>Petal Length:</label><input type="number" step="0.1" name="petal_length" required><br>
        <label>Petal Width:</label><input type="number" step="0.1" name="petal_width" required><br>
        <button type="submit">Predict</button>
    </form>

    {% if prediction is not none %}
        <h2>Prediction: {{ prediction }}</h2>
    {% endif %}
</body>
</html>
